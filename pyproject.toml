[project]
name = "electrophoresis-labeller"
version = "0.1.0"
description = "Electrophoresis gel labeller monorepo"
requires-python = ">=3.11"
dependencies = ["gel-core", "gel-app"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gel-core = { workspace = true }
gel-app = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.15", "mypy>=1.18", "pytest>=8", "pytest-qt>=4.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["packages", "tests"]
mypy_path = ["packages/gel_core/src", "packages/gel_app/src"]
explicit_package_bases = true
namespace_packages = true
strict = true

# Third-party libraries without bundled type stubs / py.typed. follow_imports
# = "skip" stops mypy descending into their (untyped) source — e.g. tifffile
# uses 3.12-only `type` statements that fail under python_version = "3.11".
[[tool.mypy.overrides]]
module = ["tifffile.*", "scipy.*", "skimage.*", "cv2", "imageio.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
