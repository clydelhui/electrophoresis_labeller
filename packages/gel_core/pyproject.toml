[project]
name = "gel-core"
version = "0.1.0"
description = "Pure image-processing engine for gel electrophoresis analysis (no GUI)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "scikit-image",
    "tifffile",
    "imageio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gel_core"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
strict = true
